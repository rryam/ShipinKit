name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Test and Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Test
        run: swift test
      - name: Build iOS Simulator
        run: >-
          xcodebuild
          -scheme ShipinKit
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  xcframework:
    name: Build XCFramework
    if: github.event_name == 'push'
    needs: quality
    runs-on: macos-latest
    env:
      PACKAGE_NAME: ShipinKit
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Build XCFramework
        run: sh ./.github/build.sh "$PACKAGE_NAME"
      - name: Upload artifact to Emerge
        env:
          EMERGE_API_KEY: ${{ secrets.EMERGE_API_KEY }}
          EMERGE_BRANCH: ${{ github.ref_name }}
          EMERGE_PREVIOUS_SHA: ${{ github.event.before }}
          EMERGE_REPOSITORY: ${{ github.repository }}
          EMERGE_SHA: ${{ github.sha }}
        run: bash ./.github/upload-to-emerge.sh "./build/${PACKAGE_NAME}.xcframework.zip"
